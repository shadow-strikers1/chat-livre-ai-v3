<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Chat Livre AI — conversas, arquivos e geração de imagens.">
<title>Chat Livre AI</title>
<style>
:root{--bg:#fff;--surface:#fafafa;--panel:#f5f5f5;--text:#111;--muted:#737373;--faint:#a3a3a3;--border:#e5e5e5;--border2:#d4d4d4;--bubble:#f4f4f4;--user:#111;--userText:#fff;--danger:#dc2626;--ok:#16a34a;--shadow:0 14px 40px rgba(0,0,0,.08);--r:14px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
html[data-theme="dark"]{--bg:#0a0a0a;--surface:#101010;--panel:#151515;--text:#f5f5f5;--muted:#a3a3a3;--faint:#666;--border:#262626;--border2:#333;--bubble:#171717;--user:#f5f5f5;--userText:#090909;--shadow:0 18px 45px rgba(0,0,0,.3)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}button{color:inherit}body{overflow:hidden}.app{height:100dvh;display:flex;max-width:1280px;margin:auto;position:relative}
.sidebar{width:280px;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;flex-shrink:0}.side-top{padding:14px}.brand{display:flex;align-items:center;gap:10px;font-weight:700}.mark{width:30px;height:30px;border:1.5px solid var(--text);border-radius:9px;display:grid;place-items:center}.mark:after{content:"";width:7px;height:7px;background:var(--text);border-radius:50%}.new-chat{width:100%;margin-top:16px;padding:10px 12px;border:1px solid var(--border2);border-radius:11px;background:var(--bg);cursor:pointer;font-weight:600}.new-chat:hover{background:var(--panel)}.chat-list{overflow:auto;padding:8px}.chat-item{display:flex;align-items:center;gap:8px;padding:10px 10px;border-radius:10px;cursor:pointer}.chat-item:hover,.chat-item.active{background:var(--panel)}.chat-item-main{min-width:0;flex:1}.chat-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.chat-date{font-size:11px;color:var(--faint);margin-top:3px}.chat-menu{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:5px}.side-bottom{margin-top:auto;padding:10px;border-top:1px solid var(--border)}.side-action{width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:9px;cursor:pointer}.side-action:hover{background:var(--panel)}
.main{min-width:0;flex:1;display:flex;flex-direction:column}.header{height:60px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--bg);flex-shrink:0}.mobile-menu{display:none}.header-title{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.status{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:#a3a3a3}.dot.online{background:var(--ok)}.icon-btn{width:36px;height:36px;border:1px solid var(--border);background:var(--bg);border-radius:9px;display:grid;place-items:center;cursor:pointer}.icon-btn:hover{background:var(--panel)}
.toolbar{display:flex;align-items:center;gap:8px;padding:9px 16px;border-bottom:1px solid var(--border);background:var(--surface)}.select{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:9px;padding:7px 10px;font-size:13px;outline:none}.toolbar-spacer{flex:1}.toggle-label{font-size:12px;color:var(--muted)}
.chat{flex:1;overflow:auto;padding:26px 18px 18px}.messages{max-width:850px;margin:auto;display:flex;flex-direction:column;gap:18px}.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);padding:40px}.empty-inner{max-width:420px}.empty h1{color:var(--text);font-size:26px;margin:0 0 8px;letter-spacing:-.03em}.empty p{margin:0;line-height:1.5}.row{display:flex}.row.user{justify-content:flex-end}.row.assistant{justify-content:flex-start}.bubble{max-width:min(86%,760px);padding:12px 14px;border:1px solid var(--border);border-radius:14px;line-height:1.58;font-size:15px}.bubble.user{background:var(--user);color:var(--userText);border-color:var(--user)}.bubble.assistant{background:var(--surface)}.bubble.error{border-color:#fca5a5;color:var(--danger)}.content p{margin:0 0 10px}.content p:last-child{margin-bottom:0}.content ul,.content ol{padding-left:22px}.content a{color:inherit}.content code{font-family:var(--mono);font-size:.88em;background:rgba(127,127,127,.15);padding:2px 5px;border-radius:5px}.code-wrap{margin:10px 0;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#0b0b0b;color:#eee}.code-head{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-bottom:1px solid #292929;font-size:11px;color:#aaa}.code-copy{border:0;background:transparent;color:#ddd;cursor:pointer}.code{display:block;padding:12px;overflow:auto;font:13px/1.55 var(--mono);white-space:pre}.meta{display:flex;align-items:center;gap:12px;margin-top:7px;color:var(--faint);font-size:11px}.meta button{border:0;background:transparent;color:var(--muted);padding:0;cursor:pointer}.meta button:hover{color:var(--text)}
.attachment-list{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}.file-card{display:flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:9px;padding:7px 9px;font-size:12px;background:var(--panel);max-width:100%}.file-card span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.preview-image{max-width:280px;max-height:240px;border-radius:10px;margin-bottom:8px;display:block}.generated-img{max-width:min(560px,100%);max-height:520px;border-radius:10px;display:block;margin:4px 0 8px}.generated-download{font-size:12px;color:var(--muted);text-decoration:none}
.composer-wrap{border-top:1px solid var(--border);padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--bg)}.composer{max-width:850px;margin:auto;border:1px solid var(--border2);border-radius:15px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}.attach-preview{display:none;padding:9px;border-bottom:1px solid var(--border);gap:7px;flex-wrap:wrap}.attach-preview.show{display:flex}.pending{display:flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:12px;background:var(--panel)}.pending .x{border:0;background:transparent;cursor:pointer;color:var(--muted)}.composer-row{display:flex;align-items:flex-end;gap:8px;padding:8px}.textarea{flex:1;border:0;outline:none;background:transparent;color:var(--text);resize:none;min-height:42px;max-height:180px;padding:10px;font-size:15px;line-height:1.45}.textarea::placeholder{color:var(--faint)}.round{width:42px;height:42px;border-radius:11px;border:1px solid var(--border);background:var(--bg);display:grid;place-items:center;cursor:pointer;flex-shrink:0}.round:hover{background:var(--panel)}.send{background:var(--user);color:var(--userText);border-color:var(--user)}.send.stop{font-size:14px}.dropzone{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.45);z-index:30}.dropzone.show{display:grid}.dropzone div{padding:28px 34px;border:1px dashed #fff;border-radius:16px;color:#fff;background:rgba(0,0,0,.75)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;padding:20px;z-index:40}.modal.show{display:grid}.modal-box{width:min(520px,100%);background:var(--bg);border:1px solid var(--border);border-radius:15px;padding:18px;box-shadow:var(--shadow)}.modal-box h3{margin:0 0 12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.modal-actions button{padding:9px 13px;border-radius:9px;border:1px solid var(--border);background:var(--bg);cursor:pointer}.modal-actions .danger{background:var(--danger);color:#fff;border-color:var(--danger)}.text-input{width:100%;border:1px solid var(--border2);background:var(--surface);color:var(--text);padding:10px;border-radius:9px;outline:none}.account{font-size:11px;color:var(--faint);padding:8px 10px}
@media(max-width:760px){.sidebar{position:fixed;z-index:25;inset:0 auto 0 0;width:min(86vw,300px);transform:translateX(-102%);transition:transform .2s ease;box-shadow:var(--shadow)}.sidebar.open{transform:none}.mobile-menu{display:grid}.header{height:56px;padding:0 10px}.toolbar{padding:8px 10px}.chat{padding:18px 10px 12px}.bubble{max-width:94%}.composer-wrap{padding-left:8px;padding-right:8px}.status{display:none}.brand-text{display:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-top">
      <div class="brand"><span class="mark"></span><span>Chat Livre AI</span></div>
      <button class="new-chat" id="newChat">＋ Nova conversa</button>
    </div>
    <div class="chat-list" id="chatList"></div>
    <div class="side-bottom">
      <div class="account" id="accountStatus">Conectando ao Firebase…</div>
      <button class="side-action" id="exportChat">↧ Exportar conversa</button>
      <button class="side-action" id="clearChat">⌫ Limpar conversa</button>
    </div>
  </aside>
  <section class="main">
    <header class="header">
      <button class="icon-btn mobile-menu" id="menuBtn" aria-label="Abrir menu">☰</button>
      <div class="header-title" id="headerTitle">Nova conversa</div>
      <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">offline</span></div>
      <button class="icon-btn" id="themeBtn" title="Alternar tema">◐</button>
      <button class="icon-btn" id="renameBtn" title="Renomear conversa">✎</button>
    </header>
    <div class="toolbar">
      <select class="select" id="mode"><option value="chat">💬 Conversar</option><option value="image">🎨 Gerar imagem</option></select>
      <select class="select" id="provider"><option value="gemini">Gemini 3.6 Flash</option><option value="openrouter">OpenRouter Free</option></select>
      <span class="toolbar-spacer"></span><span class="toggle-label">Fallback</span><input type="checkbox" id="fallback" checked>
    </div>
    <main class="chat" id="chatArea"><div class="empty" id="empty"><div class="empty-inner"><h1>Chat Livre AI</h1><p>Converse, envie arquivos, gere imagens e mantenha suas conversas sincronizadas.</p></div></div><div class="messages" id="messages"></div></main>
    <div class="composer-wrap"><form class="composer" id="composerForm"><div class="attach-preview" id="attachPreview"></div><div class="composer-row"><button type="button" class="round" id="attachBtn" title="Anexar arquivos">＋</button><input id="fileInput" type="file" hidden multiple accept=".pdf,.txt,.csv,.json,.html,.htm,.css,.js,.c,.cpp,.h,.hpp,.java,.py,.md,.png,.jpg,.jpeg,.webp"><textarea class="textarea" id="input" rows="1" placeholder="Escreva uma mensagem…"></textarea><button type="submit" class="round send" id="sendBtn" title="Enviar">↑</button></div></form></div>
  </section>
</div>
<div class="dropzone" id="dropzone"><div>Solte os arquivos aqui</div></div>
<div class="modal" id="modal"><div class="modal-box"><h3 id="modalTitle"></h3><div id="modalBody"></div><div class="modal-actions" id="modalActions"></div></div></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBptcBXdYD8kfZtZIFoWmv0outPiuuKbQ",
  authDomain: "chat-livre-ai-v2.firebaseapp.com",
  projectId: "chat-livre-ai-v2",
  storageBucket: "chat-livre-ai-v2.firebasestorage.app",
  messagingSenderId: "367169410928",
  appId: "1:367169410928:web:48d0b5fb5221443ebd61b5"
};

(function(){'use strict';
const $=id=>document.getElementById(id);
const state={uid:null,chatId:null,chats:[],messages:[],unsubChats:null,unsubMessages:null,controller:null,pendingFiles:[],theme:localStorage.getItem('cla.theme')||'light',provider:localStorage.getItem('cla.provider')||'gemini',mode:'chat',fallback:localStorage.getItem('cla.fallback')!=='0',db:null};
const MAX_FILE=1.5*1024*1024, MAX_TEXT=500*1024, MAX_FILES=4, MAX_TOTAL=3*1024*1024;
const TEXT_EXT=['txt','csv','json','html','htm','css','js','c','cpp','h','hpp','java','py','md'];
const IMG_EXT=['png','jpg','jpeg','webp'];
function ext(n){return (n.split('.').pop()||'').toLowerCase()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderMarkdown(src){
  let s=esc(src), blocks=[];
  s=s.replace(/!\[([^\]]*)\]\((\/api\/image\?[^)]+)\)/g,(_,alt,url)=>`<img class="generated-img" src="${url}" alt="${alt}"><a class="generated-download" href="${url}" target="_blank" rel="noopener">Abrir imagem</a>`); s=s.replace(/```([\w+-]*)\n([\s\S]*?)```/g,(_,lang,code)=>{let i=blocks.push({lang,code})-1;return `@@CODE${i}@@`});
  s=s.replace(/^###### (.*)$/gm,'<h6>$1</h6>').replace(/^##### (.*)$/gm,'<h5>$1</h5>').replace(/^#### (.*)$/gm,'<h4>$1</h4>').replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>');
  s=s.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_\n]+)__/g,'<strong>$1</strong>').replace(/\*([^*\n]+)\*/g,'<em>$1</em>').replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s=s.replace(/^[-*] (.*)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>\n?)+/g,m=>'<ul>'+m+'</ul>');
  s=s.replace(/\n{2,}/g,'\n\n').split(/\n\n/).map(p=>/^<(h[1-6]|ul)>/.test(p.trim())?p.trim():'<p>'+p.trim().replace(/\n/g,'<br>')+'</p>').join('');
  blocks.forEach((b,i)=>{s=s.replace(`@@CODE${i}@@`,`<div class="code-wrap"><div class="code-head"><span>${esc(b.lang||'code')}</span><button class="code-copy" data-code="${encodeURIComponent(b.code)}">Copiar</button></div><pre class="code">${esc(b.code)}</pre></div>`) });
  return s;
}
function time(){return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function setTheme(t){state.theme=t;document.documentElement.dataset.theme=t;document.querySelector('meta[name="theme-color"]').content=t==='dark'?'#0a0a0a':'#ffffff';localStorage.setItem('cla.theme',t)}
function setOnline(ok,text){$('statusDot').classList.toggle('online',ok);$('statusText').textContent=text||'online'}
function openModal(title,body,actions){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalActions').innerHTML='';actions.forEach(a=>{let b=document.createElement('button');b.textContent=a.text;b.className=a.danger?'danger':'';b.onclick=()=>{a.fn();$('modal').classList.remove('show')};$('modalActions').appendChild(b)});$('modal').classList.add('show')}
function showEmpty(){ $('empty').style.display=state.messages.length?'none':'grid'; }
function scroll(){requestAnimationFrame(()=>$('chatArea').scrollTop=$('chatArea').scrollHeight)}
function attachmentCard(a){let d=document.createElement('div');d.className='file-card';d.innerHTML='<span>'+((a.kind==='image')?'🖼️':a.kind==='pdf'?'📕':'📄')+'</span><span>'+esc(a.name)+'</span>';return d}
function addBubble(m){let row=document.createElement('div');row.className='row '+m.role;let b=document.createElement('div');b.className='bubble '+m.role+(m.error?' error':'');if(m.attachments?.length){let al=document.createElement('div');al.className='attachment-list';m.attachments.forEach(a=>al.appendChild(attachmentCard(a)));b.appendChild(al)}let c=document.createElement('div');c.className='content';c.innerHTML=m.role==='assistant'?renderMarkdown(m.content):esc(m.content).replace(/\n/g,'<br>');b.appendChild(c);let meta=document.createElement('div');meta.className='meta';meta.innerHTML='<span>'+esc(m.time||time())+'</span>';if(m.role==='assistant'&&!m.error){let cp=document.createElement('button');cp.textContent='Copiar';cp.onclick=()=>copyText(m.content,cp);meta.appendChild(cp);let regen=document.createElement('button');regen.textContent='Regenerar';regen.onclick=()=>regenerate();meta.appendChild(regen)}b.appendChild(meta);row.appendChild(b);$('messages').appendChild(row)}
function renderAll(){ $('messages').innerHTML='';state.messages.forEach(addBubble);showEmpty();scroll() }
async function copyText(t,btn){try{await navigator.clipboard.writeText(t);let old=btn.textContent;btn.textContent='Copiado';setTimeout(()=>btn.textContent=old,1000)}catch(e){alert('Não foi possível copiar.')}}
$('messages').addEventListener('click',e=>{let b=e.target.closest('.code-copy');if(b){copyText(decodeURIComponent(b.dataset.code),b)}});
function fileData(f){let e=ext(f.name);if(!TEXT_EXT.includes(e)&&!IMG_EXT.includes(e)&&e!=='pdf')throw Error('Arquivo não suportado: '+f.name);let lim=TEXT_EXT.includes(e)?MAX_TEXT:MAX_FILE;if(f.size>lim)throw Error(f.name+' excede o limite de '+Math.round(lim/1024/1024*10)/10+' MB.');if(TEXT_EXT.includes(e))return f.text().then(t=>({name:f.name,mimeType:f.type||'text/plain',kind:'text',text:t.slice(0,500000)}));return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res({name:f.name,mimeType:f.type||(e==='pdf'?'application/pdf':'image/'+(e==='jpg'||e==='jpeg'?'jpeg':e)),kind:e==='pdf'?'pdf':'image',data:String(r.result).split(',')[1]});r.onerror=()=>rej(Error('Falha lendo '+f.name));r.readAsDataURL(f)})}
function addPending(files){let arr=[...files];for(let f of arr){if(state.pendingFiles.length>=MAX_FILES)break;if(state.pendingFiles.some(x=>x.name===f.name&&x.size===f.size))continue;let e=ext(f.name),lim=TEXT_EXT.includes(e)?MAX_TEXT:MAX_FILE;if(f.size>lim){alert(f.name+' excede o limite de '+Math.round(lim/1024/1024*10)/10+' MB.');continue}let total=state.pendingFiles.reduce((n,x)=>n+x.size,0)+f.size;if(total>MAX_TOTAL){alert('O total dos anexos não pode passar de 3 MB.');break}state.pendingFiles.push(f)}renderPending()}
function renderPending(){let p=$('attachPreview');p.innerHTML='';p.classList.toggle('show',state.pendingFiles.length>0);state.pendingFiles.forEach((f,i)=>{let d=document.createElement('div');d.className='pending';d.innerHTML='<span>'+esc(f.name)+'</span><button class="x" type="button">×</button>';d.querySelector('.x').onclick=()=>{state.pendingFiles.splice(i,1);renderPending()};p.appendChild(d)})}
function auto(){let t=$('input');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,180)+'px'}
function titleFrom(text){return (text||'Nova conversa').trim().replace(/\s+/g,' ').slice(0,48)||'Nova conversa'}
async function createChat(){if(!state.uid)return;let ref=await state.db.collection('users').doc(state.uid).collection('chats').add({title:'Nova conversa',createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});await selectChat(ref.id);closeSide()}
async function selectChat(id){if(state.unsubMessages)state.unsubMessages();state.chatId=id;state.messages=[];renderAll();let ref=state.db.collection('users').doc(state.uid).collection('chats').doc(id);state.unsubMessages=ref.collection('messages').orderBy('createdAt','asc').onSnapshot(s=>{state.messages=s.docs.map(d=>({id:d.id,...d.data()}));$('headerTitle').textContent=state.chats.find(c=>c.id===id)?.title||'Conversa';renderAll()});}
function subscribeChats(){let ref=state.db.collection('users').doc(state.uid).collection('chats').orderBy('updatedAt','desc');state.unsubChats=ref.onSnapshot(async s=>{state.chats=s.docs.map(d=>({id:d.id,...d.data()}));renderChatList();if(!state.chatId&&state.chats[0])selectChat(state.chats[0].id);if(!state.chats.length)createChat()})}
function renderChatList(){let box=$('chatList');box.innerHTML='';state.chats.forEach(c=>{let d=document.createElement('div');d.className='chat-item'+(c.id===state.chatId?' active':'');d.onclick=()=>{selectChat(c.id);closeSide()};let main=document.createElement('div');main.className='chat-item-main';main.innerHTML='<div class="chat-title">'+esc(c.title||'Nova conversa')+'</div><div class="chat-date">'+(c.updatedAt?.toDate?c.updatedAt.toDate().toLocaleDateString('pt-BR'):'')+'</div>';let m=document.createElement('button');m.className='chat-menu';m.textContent='⋯';m.onclick=e=>{e.stopPropagation();chatMenu(c)};d.append(main,m);box.appendChild(d)})}
function chatMenu(c){openModal('Conversa', '<p>'+esc(c.title||'Nova conversa')+'</p>',[{text:'Excluir',danger:true,fn:()=>deleteChat(c.id)}])}
async function deleteChat(id){if(!state.uid)return;let chatRef=state.db.collection('users').doc(state.uid).collection('chats').doc(id);let snap=await chatRef.collection('messages').get();let batch=state.db.batch();snap.docs.forEach(d=>batch.delete(d.ref));batch.delete(chatRef);await batch.commit();if(id===state.chatId)state.chatId=null}
async function renameChat(){let c=state.chats.find(x=>x.id===state.chatId);if(!c)return;openModal('Renomear conversa','<input class="text-input" id="renameInput" value="'+esc(c.title||'Nova conversa')+'">',[{text:'Cancelar',fn:()=>{}},{text:'Salvar',fn:async()=>{let v=$('renameInput').value.trim().slice(0,80)||'Nova conversa';await state.db.collection('users').doc(state.uid).collection('chats').doc(state.chatId).update({title:v,updatedAt:firebase.firestore.FieldValue.serverTimestamp()})}}])}
async function clearCurrent(){if(!state.chatId)return;openModal('Limpar conversa','Isso apaga todas as mensagens desta conversa.',[{text:'Cancelar',fn:()=>{}},{text:'Apagar',danger:true,fn:async()=>{let ref=state.db.collection('users').doc(state.uid).collection('chats').doc(state.chatId).collection('messages');let snap=await ref.get();let batch=state.db.batch();snap.docs.forEach(d=>batch.delete(d.ref));await batch.commit()}}])}
async function exportChat(){let c=state.chats.find(x=>x.id===state.chatId);if(!c)return;let text='# '+(c.title||'Chat Livre AI')+'\n\n'+state.messages.map(m=>'## '+m.role+'\n\n'+m.content).join('\n\n');let blob=new Blob([text],{type:'text/markdown'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(c.title||'chat').replace(/[^a-z0-9-_]+/gi,'_')+'.md';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function send(){if(state.controller)return;let text=$('input').value.trim(),files=state.pendingFiles.slice();if(state.mode==='image'){if(!text)return;return generateImage(text)}if(!text&&!files.length)return;state.pendingFiles=[];renderPending();$('input').value='';auto();let attachments=[];try{for(let f of files)attachments.push(await fileData(f))}catch(e){alert(e.message);state.pendingFiles=files;renderPending();return}let userMsg={role:'user',content:text||'Analise os arquivos anexados.',attachments:attachments.map(a=>({name:a.name,mimeType:a.mimeType,kind:a.kind})),time:time()};await saveMessage(userMsg);let payloadMessages=state.messages.filter(m=>m.role==='user'||m.role==='assistant').slice(-40).map(m=>({role:m.role,content:m.content}));let currentText=text||'Analise os arquivos anexados.';if(!payloadMessages.length||payloadMessages[payloadMessages.length-1].role!=='user'||payloadMessages[payloadMessages.length-1].content!==currentText)payloadMessages.push({role:'user',content:currentText});payloadMessages=payloadMessages.slice(-40);await requestAI(currentText,payloadMessages,attachments)}
async function requestAI(text,msgs,attachments,regen=false){state.controller=new AbortController();$('sendBtn').classList.add('stop');$('sendBtn').textContent='■';try{let payload={provider:state.provider,messages:msgs,attachment:attachments[0]||null,attachments};let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:state.controller.signal});let d=await r.json().catch(()=>({}));if(!r.ok&&state.fallback){let alt=state.provider==='gemini'?'openrouter':'gemini';let r2=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload,provider:alt}),signal:state.controller.signal});d=await r2.json().catch(()=>({}));r=r2}if(!r.ok)throw Error(d.error||'A IA não respondeu.');await saveMessage({role:'assistant',content:d.reply,time:time(),provider:d.provider})}catch(e){if(e.name!=='AbortError')await saveMessage({role:'assistant',content:'Erro: '+e.message,error:true,time:time()})}finally{state.controller=null;$('sendBtn').classList.remove('stop');$('sendBtn').textContent='↑';}}
async function regenerate(){let i=-1;for(let j=state.messages.length-1;j>=0;j--)if(state.messages[j].role==='user'){i=j;break}if(i<0)return;let last=state.messages[i];let msgs=state.messages.slice(0,i).filter(m=>m.role==='user'||m.role==='assistant').slice(-39).map(m=>({role:m.role,content:m.content}));msgs.push({role:'user',content:last.content});await requestAI(last.content,msgs,[],true)}
async function saveMessage(m){if(!state.chatId)return;let chatRef=state.db.collection('users').doc(state.uid).collection('chats').doc(state.chatId);await chatRef.collection('messages').add({...m,createdAt:firebase.firestore.FieldValue.serverTimestamp()});let update={updatedAt:firebase.firestore.FieldValue.serverTimestamp()};let current=state.chats.find(c=>c.id===state.chatId);if(current&&current.title==='Nova conversa'&&m.role==='user')update.title=titleFrom(m.content);await chatRef.update(update).catch(()=>{})}
async function generateImage(prompt){state.controller=new AbortController();$('sendBtn').classList.add('stop');$('sendBtn').textContent='■';await saveMessage({role:'user',content:prompt,time:time()});try{let r=await fetch('/api/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt}),signal:state.controller.signal});let d=await r.json();if(!r.ok)throw Error(d.error||'Falha ao gerar imagem');await saveMessage({role:'assistant',content:'![Imagem gerada]('+d.imageUrl+')',time:time()})}catch(e){if(e.name!=='AbortError')await saveMessage({role:'assistant',content:'Erro: '+e.message,error:true,time:time()})}finally{state.controller=null;$('sendBtn').classList.remove('stop');$('sendBtn').textContent='↑'}}
function closeSide(){$('sidebar').classList.remove('open')}
async function boot(){setTheme(state.theme);$('provider').value=state.provider;$('fallback').checked=state.fallback; if(!firebaseConfigOK()){setOnline(false,'Firebase não configurado');$('accountStatus').textContent='Firebase precisa ser configurado';return}try{firebase.initializeApp(FIREBASE_CONFIG);state.db=firebase.firestore();let cred=await firebase.auth().signInAnonymously();state.uid=cred.user.uid;$('accountStatus').textContent='Sessão anônima ativa';setOnline(true,'online');subscribeChats()}catch(e){console.error(e);setOnline(false,'Firebase erro');$('accountStatus').textContent='Erro Firebase: '+e.message}}
function firebaseConfigOK(){return FIREBASE_CONFIG.apiKey&&!FIREBASE_CONFIG.apiKey.startsWith('COLE_')&&FIREBASE_CONFIG.projectId&&!FIREBASE_CONFIG.projectId.startsWith('SEU_')}
$('newChat').onclick=createChat;$('themeBtn').onclick=()=>setTheme(state.theme==='dark'?'light':'dark');$('renameBtn').onclick=renameChat;$('clearChat').onclick=clearCurrent;$('exportChat').onclick=exportChat;$('menuBtn').onclick=()=>$('sidebar').classList.toggle('open');$('provider').onchange=e=>{state.provider=e.target.value;localStorage.setItem('cla.provider',state.provider)};$('fallback').onchange=e=>{state.fallback=e.target.checked;localStorage.setItem('cla.fallback',state.fallback?'1':'0')};$('mode').onchange=e=>{state.mode=e.target.value;$('provider').disabled=state.mode==='image';$('input').placeholder=state.mode==='image'?'Descreva a imagem…':'Escreva uma mensagem…'};$('composerForm').onsubmit=e=>{e.preventDefault();if(state.controller){state.controller.abort();return}send()};$('input').oninput=auto;$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('composerForm').requestSubmit()}};$('attachBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>addPending(e.target.files);window.addEventListener('dragover',e=>{e.preventDefault();$('dropzone').classList.add('show')});window.addEventListener('dragleave',e=>{if(e.clientX<=0||e.clientY<=0)$('dropzone').classList.remove('show')});window.addEventListener('drop',e=>{e.preventDefault();$('dropzone').classList.remove('show');addPending(e.dataTransfer.files)});window.addEventListener('paste',e=>{let files=[...e.clipboardData.files].filter(f=>f.type.startsWith('image/'));if(files.length)addPending(files)});window.addEventListener('online',()=>setOnline(true,'online'));window.addEventListener('offline',()=>setOnline(false,'offline'));boot();
})();
</script>
</body></html>
